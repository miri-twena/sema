<!doctype html>
<!-- dir is explicit so the direction-aware slide keyframes and Tailwind's
     ltr:/rtl: variants have an attribute to match on. Flipping this to "rtl"
     mirrors the whole shell. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEMA — AI Business Advisor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
