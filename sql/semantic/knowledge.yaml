- name: "Black Friday & Cyber Monday"
  type: recurring_event
  date_range:
    start: "2025-11-24"
    end: "2025-12-01"
  recurrence: "Last week of November through the first Monday of December, annually"
  description: >
    Peak holiday shopping event spanning the last week of November through
    Cyber Monday. Falls inside the dataset's broader November (+35%) and
    December (+45%) seasonal peaks -- order volume and revenue are elevated
    through this whole window, not only on Black Friday itself.
  affects: [revenue, aov, conversion_rate]

- name: "Post-holiday seasonal slowdown"
  type: recurring_event
  date_range:
    start: "2026-01-01"
    end: "2026-03-31"
  recurrence: >
    January through March, annually -- monthly order volume runs 10-20%
    below the yearly baseline
  description: >
    The post-holiday trough: monthly order volume is deliberately scaled
    down (-20% January, -10% February, -20% March vs. baseline) after the
    Q4 peak. March 2026 additionally carries the dataset's separate
    revenue-dip story (extra Electronics, Meta, and returning-customer
    effects) on top of this baseline seasonal softness -- don't attribute
    the whole March drop to seasonality alone.
  affects: [revenue, conversion_rate]

- name: "Checkout outage"
  type: incident
  date_range:
    start: "2025-08-12"
    end: "2025-08-12"
  description: >
    A plausible one-day checkout-outage: 2025-08-12 recorded only 30
    completed orders (~$24.8K revenue), the lowest single day in an
    otherwise stable, non-holiday stretch of the dataset -- well below the
    ~49 orders/day norm for that period. This is a coincidental artifact of
    the random seed, not an engineered generator effect, so its date shifts
    whenever the demo data is regenerated -- re-detect the lowest-orders day
    in a stable stretch (see data/README.md's regeneration notes) rather
    than assuming this date still holds.
  affects: [revenue, conversion_rate]

- name: "Marketing pixel misfire"
  type: incident
  date_range:
    start: "2025-09-08"
    end: "2025-09-14"
  description: >
    A plausible one-week tracking-pixel misfire during Google Campaign 3's
    run (Google channel, active 2025-09-01 to 2025-09-30). Orders placed in
    this window that the campaign actually influenced may be missing their
    campaign_id, undercounting that week's attributed_revenue and roi for
    the campaign. Like the checkout outage above, this is a coincidental
    RNG artifact with no corresponding generator constant -- re-pick a
    campaign window after any regeneration rather than assuming this one
    still applies.
  affects: [campaign_roi]

- name: "Electronics price increase"
  type: note
  date_range:
    start: "2026-07-01"
    end: "2026-07-01"
  description: >
    Electronics list prices rose +7% on 2026-07-01 (historical order_items
    keep the price sold at; products.unit_price reflects the new list
    price, unit_cost unchanged). This note tracks PRICE_INCREASE_MONTH in
    data/generate_data.py, which is always the dataset's LAST month -- its
    date moves forward on every regeneration. Verified effect (this
    regeneration): average Electronics unit price +4.6% ($409.60 ->
    $428.31) with units sold -9.5%, leaving category revenue down -4.8%
    even while every other category was lifted by that same month's Summer
    Sale volume surge.
  affects: [aov, gross_margin]
