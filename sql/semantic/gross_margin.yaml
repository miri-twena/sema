name: gross_margin
label: Gross Margin
domain: finance
sensitive: financials
description: >
  Gross profit and gross margin percentage on completed orders: revenue
  (order_items.quantity * unit_price at time of sale) minus cost of goods
  sold (order_items.quantity * products.unit_cost). This is profitability
  data, distinct from the top-line Revenue metric, and is restricted to
  users with financial data access.
grain: one row per order line item
sql: |
  SELECT
      ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue,
      ROUND(SUM(oi.quantity * p.unit_cost), 2) AS cogs,
      ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost)), 2) AS gross_profit,
      ROUND(
          100.0 * SUM(oi.quantity * (oi.unit_price - p.unit_cost))
          / NULLIF(SUM(oi.quantity * oi.unit_price), 0)
      , 1) AS gross_margin_pct
  FROM order_items oi
  JOIN orders o ON o.order_id = oi.order_id
  JOIN products p ON p.product_id = oi.product_id
  WHERE o.status = 'completed'
dimensions:
  - name: category
    sql: "products.category"
  - name: month
    sql: "DATE_TRUNC('month', orders.order_date)"
filters:
  completed_only: "orders.status = 'completed'"
examples:
  - question: "What is our gross margin?"
    approach: "Sum quantity * (unit_price - unit_cost) over completed order_items, divided by revenue."
  - question: "Which category has the best margin?"
    approach: "Gross margin grouped by the category dimension, ordered by gross_margin_pct descending."
status: certified
synonyms: ["רווח", "רווחיות", "margin"]
