# SEMA golden-question eval set -- ecommerce client.
#
# Expected values below were read directly from the LIVE database (see
# evals/README.md for the exact queries used), not copied from documentation
# -- data/README.md's own summary numbers turned out to describe a slightly
# different metric than some of these questions ask (e.g. its "~40%" VIP
# figure is about the *designed generator cohort*, not "top 5% by lifetime
# revenue" which is what customers actually ask and what the semantic
# layer's alternative_definition computes -- the real number is 48.2%).
# Always re-verify against the live DB when adding a question here.
#
# Re-verified 2026-08-01 after demo_freshness_prompt.md made END_DATE relative
# (last complete calendar month before today, currently 2025-07-01 ..
# 2026-07-31). The March-2026-dip story stays pinned to real March by design;
# the Summer-Sale/price-increase/email-lift story now lives in the window's
# LAST month, which was June 2026 pre-fix and is July 2026 as of this
# re-verification -- it will keep sliding forward every time the demo is
# regenerated. Whoever next regenerates the demo data must re-verify this
# file against the live DB and update the shifted-month questions/values
# again (same manual process as any other re-verification here). Numbers
# that moved are noted inline with their previous value.

questions:
  - id: revenue_trend_peak_month
    question: "Show revenue trend by month."
    assertions:
      contains_any: ["December", "Dec"]
      numeric_within:
        - value: 1639978 # December 2025 revenue, the Q4 peak (was 1698041 before the freshness fix)
          tolerance_pct: 10
      expects_sql: true

  - id: q4_vs_q1_direction
    question: "How did Q4 2025 revenue compare to Q1 2026?"
    assertions:
      direction: down # Q1 2026 is the seasonal post-holiday trough
      expects_sql: true

  - id: march_dip_overall
    question: "Why did revenue drop in March 2026?"
    assertions:
      contains_any: ["March"]
      direction: down
      expects_sql: true

  - id: march_dip_category_driver
    question: "Which product category contributed most to the March 2026 revenue drop?"
    assertions:
      # Feb->Mar: $455.8K -> $342.5K. That is a -$113.2K absolute drop -- the
      # LARGEST of any category, i.e. the biggest contributor to the decline.
      # Note it is not the steepest by percentage (-24.8%; Sports & Outdoors
      # falls -28.7%), so this question is deliberately about absolute
      # contribution.
      contains_any: ["Electronics"]
      expects_sql: true

  - id: march_dip_channel_driver
    question: "Which marketing channel underperformed in March 2026?"
    assertions:
      contains_any: ["Meta"] # Feb->Mar order count: 230 -> 126, -45.2%, steepest of any channel
      expects_sql: true

  - id: vip_customers_identified
    question: "Who are our most valuable customers?"
    assertions:
      contains_any: ["VIP"]
      expects_sql: true

  - id: revenue_concentration_top5pct
    question: "What percentage of total revenue comes from the top 5% of customers?"
    assertions:
      numeric_within:
        - value: 47.9 # 202 of 4030 paying customers = 47.9% of revenue (was 48.2% before the freshness fix)
          tolerance_pct: 15
      expects_sql: true

  - id: churn_risk_count
    question: "How many customers are at risk of churning (no order in the last 90 days)?"
    assertions:
      # Customers with no completed order in the 90 days before the dataset's
      # max order date. The cutoff is END_DATE - 90d by design, so it moves
      # with END_DATE every regeneration (currently 2026-05-02); the count
      # itself is stable (1791, was 1795) because it's relative, not because
      # the window didn't move.
      numeric_within:
        - value: 1791
          tolerance_pct: 15
      expects_sql: true

  - id: worst_campaign
    question: "Which marketing campaign has performed worst?"
    assertions:
      # Re-verified 2026-08-01: lowest ROAS is "Meta Retarget - Electronics"
      # (6.51), with "Email Campaign 4" a close second-worst (6.69) -- the
      # two have swapped rank again since the last re-verification (was
      # Email Campaign 4 6.86 / Meta Retarget 7.98), which is expected: their
      # random campaign windows/budgets shift every regeneration. Both names
      # stay accepted: the two are close enough that a model reasonably
      # naming either is not a regression, but a model naming a HIGH-ROAS
      # campaign is.
      contains_any: ["Email Campaign 4", "Meta Retarget"]
      expects_sql: true

  # --- "Summer Sale" scenarios: always the window's LAST month -------------
  # These three stories (Summer Sale, Electronics price increase, Email
  # lift) are all pinned to SUMMER_SALE_MONTH/PRICE_INCREASE_MONTH/
  # EMAIL_LIFT_MONTH in data/generate_data.py, which is always the window's
  # last calendar month -- June 2026 pre-freshness-fix, July 2026 as of this
  # re-verification (2026-08-01). Whoever regenerates the demo again must
  # bump the month in these questions (and re-verify the numbers) to match
  # whatever the new last month is.

  - id: summer_sale_bought_growth
    question: "Did July 2026 revenue growth come from more orders or higher order values?"
    assertions:
      # Orders 1501 -> 1861 (+24%) but revenue only $1.166M -> $1.190M (+2.0%),
      # because AOV fell $777.08 -> $639.36 (-17.7%) under heavy discounting.
      # The answer must attribute growth to VOLUME, not order value.
      contains_any: ["order", "volume", "discount"]
      expects_sql: true

  - id: summer_sale_aov_direction
    question: "What happened to average order value in July 2026 compared to June?"
    assertions:
      direction: down # $777.08 -> $639.36
      numeric_within:
        - value: 639.36
          tolerance_pct: 15
      expects_sql: true

  - id: electronics_price_increase
    question: "Electronics prices went up in July 2026. What happened to Electronics revenue and units?"
    assertions:
      # Price +7% (realised avg unit price $409.60 -> $428.31), units
      # 1404 -> 1270 (-9.5%), revenue $577K -> $549K (-4.8%) -- a real
      # decline this cycle rather than flat, but still the only category
      # that fell while every other category grew on the sale.
      contains_any: ["flat", "unit", "volume", "declin", "fell"]
      expects_sql: true

  - id: best_channel_june
    question: "Which traffic source converted best in July 2026?"
    assertions:
      contains_any: ["Email"] # 32.06% vs Direct 22.81%; Email is normally 2nd-3rd
      expects_sql: true

  # --- component-type + faithfulness coverage ------------------------------
  # These exercise the structural assertions (expects_components, faithful)
  # rather than exact numbers, so they stay green across the model's phrasing
  # variation while still catching "answered without the expected widget" and
  # "quoted a revenue figure that isn't in any query result" regressions.

  - id: revenue_trend_renders_chart
    question: "Show me the monthly revenue trend as a chart."
    assertions:
      expects_sql: true
      expects_components: ["chart"]
      expects_chart_kind: line # trend_line_charts_prompt.md: a time x-axis is ALWAYS a line chart
      faithful: true # no large revenue number in the prose may be ungrounded

  # --- line vs. bar chart selection (trend_line_charts_prompt.md) -----------
  # x-axis is a date/period sequence -> line, even asked in Hebrew, even for
  # what reads like a "trend" question about a single thing (not a
  # multi-category comparison). Mirrors the exact wording from the user
  # report this task was filed against.

  - id: revenue_by_month_is_a_line_chart_he
    question: "הכנסות לפי חודש" # "Revenue by month"
    assertions:
      expects_sql: true
      expects_components: ["chart"]
      expects_chart_kind: line

  - id: revenue_by_month_is_a_line_chart_en
    question: "Revenue by month"
    assertions:
      expects_sql: true
      expects_components: ["chart"]
      expects_chart_kind: line

  # x-axis is categorical (no inherent time order) -> bar, not line.

  - id: revenue_by_category_is_a_bar_chart_he
    question: "הכנסות לפי קטגוריה" # "Revenue by category"
    assertions:
      expects_sql: true
      expects_components: ["chart"]
      expects_chart_kind: bar

  - id: revenue_by_category_is_a_bar_chart_en
    question: "Show revenue by category as a chart."
    assertions:
      expects_sql: true
      expects_components: ["chart"]
      expects_chart_kind: bar

  - id: vip_list_full_table
    question: "List all our VIP customers (top 5% by lifetime revenue) with their lifetime revenue."
    assertions:
      # The "406-row list" class of question: the answer must render the FULL
      # table, not fold the list into prose. ~203 customers qualify (see
      # revenue_concentration_top5pct), well past any preview cap.
      expects_sql: true
      expects_components: ["table"]

  - id: top_customers_faithful
    question: "Who are our top 10 customers by total revenue, and how much has each spent?"
    assertions:
      expects_sql: true
      expects_components: ["table"]
      faithful: true

  # --- Hebrew mirrors -------------------------------------------------------
  # Same verified ground truth as their English twins, asked in Hebrew, so a
  # prompt change that silently degrades the Hebrew path (wrong language, lost
  # RTL story, dropped numbers) is caught. Numbers re-use the English cases'
  # live-DB-verified values.

  - id: revenue_trend_peak_month_he
    question: "הצג את מגמת ההכנסות לפי חודש." # "Show revenue trend by month."
    assertions:
      contains_any: ["דצמבר", "December", "Dec"] # December is the Q4 peak
      numeric_within:
        - value: 1698041 # December 2025 revenue (see revenue_trend_peak_month)
          tolerance_pct: 10
      expects_sql: true

  - id: march_dip_overall_he
    question: "למה ההכנסות ירדו במרץ 2026?" # "Why did revenue drop in March 2026?"
    assertions:
      direction: down
      expects_sql: true

  - id: revenue_concentration_top5pct_he
    question: "כמה אחוזים מסך ההכנסות מגיעים מ-5% הלקוחות המובילים?"
    assertions:
      numeric_within:
        - value: 48.2 # top 5% of paying customers = 48.2% of revenue
          tolerance_pct: 15

  # --- off-topic: witty deflection + grounded redirect ----------------------
  # These score mode + "no data tool ran" deterministically; the humor/tone
  # itself is judged by eye when tuning the prompt (loose on purpose -- exact
  # phrasing varies run to run, see README's philosophy).

  - id: off_topic_weather_gets_a_witty_grounded_redirect
    question: "What's the weather like today?"
    assertions:
      mode: off_topic
      expects_no_sql: true

  - id: off_topic_recipe_gets_a_witty_grounded_redirect_he
    question: "יש לך מתכון טוב לספגטי?" # "Do you have a good spaghetti recipe?"
    assertions:
      mode: off_topic
      expects_no_sql: true

  - id: off_topic_sensitive_topic_gets_no_humor
    # A weighty/sensitive topic must still redirect (mode=off_topic), but the
    # prompt's rule is "skip the joke entirely" here -- not mechanically
    # scorable (no negative-assertion for "contains no joke"), so this case
    # is a deliberate eyeball check when tuning the off-topic prompt: read the
    # actual answer and confirm it's warm/neutral with zero humor, unlike the
    # two cases above.
    question: "My father passed away recently and I'm not sure how to keep running the business without him."
    assertions:
      mode: off_topic
      expects_no_sql: true

  # --- recommendation engine: structured, evidence-based, no filler ---------

  - id: churn_recommendations_are_structured_and_specific
    question: "Which customers are at risk of churning and what should we do about it?"
    assertions:
      expects_sql: true
      expects_structured_actions: true
      no_truism_actions: true

  - id: campaign_roi_recommendations_are_structured_and_specific
    question: "Which marketing campaigns are underperforming and what should we do?"
    assertions:
      expects_sql: true
      expects_structured_actions: true
      no_truism_actions: true
      expects_sql: true

  # --- drill-down language anchoring (bugfix_batch_prompt.md bug 2) ---------
  # A drill-down's [SEMA-CONTEXT] carries the widget's title/detail in
  # English ALWAYS (KpiCards/ChartRenderer/DataTable build that text as a
  # hardcoded English literal regardless of the UI or question language --
  # see frontend/src/components/KpiCards.tsx's `detail`), so these two cases
  # deliberately mirror each other: same English context text, opposite
  # parent-turn/follow-up language, to prove the model is anchoring the
  # `summary` field to THIS TURN's question and not to the context block or
  # the conversation's dominant language either way.

  - id: drill_summary_hebrew_question_over_english_parent
    question: "למה זה עלה?" # "Why did it go up?"
    drill:
      parent_question: "What was total revenue in July 2026?"
      parent_answer: "Total revenue in July 2026 was $1,189,852, up 2.0% from June 2026."
      context_kind: kpi
      context_title: "Revenue · Jul 2026"
      context_detail: "current value $1,189,852, up 2.0% MoM"
    assertions:
      summary_language: he

  - id: drill_summary_english_question_over_hebrew_parent
    question: "Why did it go up?"
    drill:
      parent_question: "מה היו ההכנסות ביולי 2026?"
      parent_answer: "ההכנסות ביולי 2026 היו 1,189,852$, עלייה של 2.0% לעומת יוני 2026."
      context_kind: kpi
      context_title: "Revenue · Jul 2026"
      context_detail: "current value $1,189,852, up 2.0% MoM"
    assertions:
      summary_language: en
